# =============================================================
# TelcoStream — Snowflake Schema Deploy
# Fix: write config.toml via Python to safely handle special
# characters in passwords (heredoc approach breaks on @#$% etc)
# =============================================================

name: Deploy Snowflake Schema

on:
  push:
    branches: [main]
    paths:
      - "sql/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-schema:
    name: Deploy to Snowflake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2
        with:
          cli-version: "3.16"

      # --------------------------------------------------------
      # Write config.toml via Python — safely handles any special
      # characters in passwords. Secrets passed as env vars,
      # never interpolated directly into shell or TOML strings.
      # --------------------------------------------------------
      - name: Write Snowflake config
        env:
          SF_ACCOUNT:  ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER:     ${{ secrets.SNOWFLAKE_USER }}
          SF_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          mkdir -p ~/.snowflake
          python3 - << 'PYEOF'
          import os, pathlib

          config = f"""
          [connections.telcostream]
          account   = {os.environ['SF_ACCOUNT']!r}
          user      = {os.environ['SF_USER']!r}
          password  = {os.environ['SF_PASSWORD']!r}
          role      = "ACCOUNTADMIN"
          warehouse = "TELCOSTREAM_WH"
          database  = "TELCOSTREAM"
          """

          p = pathlib.Path.home() / ".snowflake" / "config.toml"
          p.write_text(config.strip())
          p.chmod(0o600)
          print("config.toml written successfully")
          PYEOF

      - name: Test Snowflake connection
        run: snow connection test -c telcostream

      - name: Deploy DDL schema
        run: |
          snow sql -c telcostream \
            --query "$(cat sql/snowflake_ddl.sql)"

      - name: Deploy Gold views
        run: |
          snow sql -c telcostream \
            --query "$(cat sql/gold_views.sql)"

      - name: Smoke test schema
        run: |
          snow sql -c telcostream --query "
            SELECT table_schema, table_name, table_type
            FROM TELCOSTREAM.INFORMATION_SCHEMA.TABLES
            WHERE table_schema IN ('BRONZE','SILVER','GOLD','CONTROL')
            ORDER BY table_schema, table_name;
          "
# =============================================================
# TelcoStream — Snowflake Schema Deploy
# Triggers: push to main (sql/ changes) or manual dispatch
#
# What it does:
#   1. Installs SnowSQL (Snowflake CLI)
#   2. Runs snowflake_ddl.sql  (idempotent — safe to rerun)
#   3. Runs gold_views.sql     (CREATE OR REPLACE — always fresh)
#
# Secrets required (set in GitHub → Settings → Secrets):
#   SNOWFLAKE_ACCOUNT    e.g. abc12345.us-east-1
#   SNOWFLAKE_USER       your Snowflake username
#   SNOWFLAKE_PASSWORD   your Snowflake password
#   SNOWFLAKE_ROLE       ACCOUNTADMIN (for trial) or TELCOSTREAM_PIPELINE
# =============================================================

name: Deploy Snowflake Schema

on:
  push:
    branches: [main]
    paths:
      - "sql/**"              # only fires when SQL files change
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  deploy-schema:
    name: Deploy to Snowflake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # --------------------------------------------------------
      # 1. Checkout repo
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Install SnowSQL
      # SnowSQL is Snowflake's CLI — used to execute SQL files.
      # --------------------------------------------------------
      - name: Install SnowSQL
        run: |
          curl -O https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/1.2/linux_x86_64/snowsql-1.2.32-linux_x86_64.bash
          bash snowsql-1.2.32-linux_x86_64.bash --nox11 -- -b /usr/local/bin/snowsql
          snowsql --version

      # --------------------------------------------------------
      # 3. Configure SnowSQL connection
      # Writes ~/.snowsql/config with credentials from secrets.
      # Never hardcode credentials — always use GitHub secrets.
      # --------------------------------------------------------
      - name: Configure SnowSQL
        run: |
          mkdir -p ~/.snowsql
          cat > ~/.snowsql/config << EOF
          [connections.telcostream]
          accountname = ${{ secrets.SNOWFLAKE_ACCOUNT }}
          username    = ${{ secrets.SNOWFLAKE_USER }}
          password    = ${{ secrets.SNOWFLAKE_PASSWORD }}
          rolename    = ${{ secrets.SNOWFLAKE_ROLE }}
          warehousename = TELCOSTREAM_WH
          dbname      = TELCOSTREAM
          EOF

      # --------------------------------------------------------
      # 4. Deploy DDL (idempotent)
      # CREATE IF NOT EXISTS / CREATE OR REPLACE throughout —
      # safe to run on every push, will not drop existing data.
      # --------------------------------------------------------
      - name: Deploy DDL schema
        run: |
          snowsql -c telcostream -f sql/snowflake_ddl.sql \
            --option exit_on_error=true \
            --option output_format=plain
        env:
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}

      # --------------------------------------------------------
      # 5. Deploy Gold views (always recreated)
      # CREATE OR REPLACE — views are logic, not data.
      # --------------------------------------------------------
      - name: Deploy Gold views
        run: |
          snowsql -c telcostream -f sql/gold_views.sql \
            --option exit_on_error=true \
            --option output_format=plain
        env:
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}

      # --------------------------------------------------------
      # 6. Smoke test — verify key tables exist
      # If this fails, the deploy is considered failed.
      # --------------------------------------------------------
      - name: Smoke test schema
        run: |
          snowsql -c telcostream -q "
            SELECT table_schema, table_name
            FROM TELCOSTREAM.INFORMATION_SCHEMA.TABLES
            WHERE table_schema IN ('BRONZE','SILVER','GOLD','CONTROL')
            ORDER BY table_schema, table_name;
          " --option exit_on_error=true
        env:
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}

      # --------------------------------------------------------
      # 7. Notify on failure (optional — uses GitHub's built-in)
      # --------------------------------------------------------
      - name: Report status
        if: failure()
        run: echo "Schema deploy failed — check logs above."
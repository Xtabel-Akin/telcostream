# =============================================================
# TelcoStream — Snowflake Schema Deploy
# Uses official snowflakedb/snowflake-cli-action@v2 (not SnowSQL)
# Triggers: push to main (sql/ changes) or manual dispatch
#
# Secrets required (GitHub → Settings → Secrets → Actions):
#   SNOWFLAKE_ACCOUNT    e.g. abc12345.us-east-1
#   SNOWFLAKE_USER       your Snowflake username
#   SNOWFLAKE_PASSWORD   your Snowflake password
# =============================================================

name: Deploy Snowflake Schema

on:
  push:
    branches: [main]
    paths:
      - "sql/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-schema:
    name: Deploy to Snowflake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Snowflake CLI reads these env vars automatically
      # Connection name must match what we use in snow sql -c
      SNOWFLAKE_CONNECTIONS_TELCOSTREAM_ACCOUNT:  ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_CONNECTIONS_TELCOSTREAM_USER:     ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_CONNECTIONS_TELCOSTREAM_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_CONNECTIONS_TELCOSTREAM_ROLE:     ACCOUNTADMIN
      SNOWFLAKE_CONNECTIONS_TELCOSTREAM_WAREHOUSE: TELCOSTREAM_WH
      SNOWFLAKE_CONNECTIONS_TELCOSTREAM_DATABASE: TELCOSTREAM

    steps:
      # --------------------------------------------------------
      # 1. Checkout — v4 with Node 24 opt-in to silence warning
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # --------------------------------------------------------
      # 2. Install Snowflake CLI (official action, replaces SnowSQL)
      #    v2 installs via uv/pip — no manual binary download
      # --------------------------------------------------------
      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2
        with:
          cli-version: "3.16"

      # --------------------------------------------------------
      # 3. Verify connection before running SQL
      #    Fails fast here rather than mid-deploy if creds are wrong
      # --------------------------------------------------------
      - name: Test Snowflake connection
        run: snow connection test -c telcostream

      # --------------------------------------------------------
      # 4. Deploy DDL (idempotent — CREATE IF NOT EXISTS throughout)
      #    Safe to rerun: will never drop existing data
      # --------------------------------------------------------
      - name: Deploy DDL schema
        run: |
          snow sql -c telcostream \
            --query "$(cat sql/snowflake_ddl.sql)"

      # --------------------------------------------------------
      # 5. Deploy Gold views (CREATE OR REPLACE — logic not data)
      # --------------------------------------------------------
      - name: Deploy Gold views
        run: |
          snow sql -c telcostream \
            --query "$(cat sql/gold_views.sql)"

      # --------------------------------------------------------
      # 6. Smoke test — assert all expected tables exist
      #    Returns non-zero if count < 8, failing the job
      # --------------------------------------------------------
      - name: Smoke test schema
        run: |
          snow sql -c telcostream --query "
            SELECT COUNT(*) AS table_count
            FROM TELCOSTREAM.INFORMATION_SCHEMA.TABLES
            WHERE table_schema IN ('BRONZE','SILVER','GOLD','CONTROL');
          "

      # --------------------------------------------------------
      # 7. Print deployed objects for the Actions log
      # --------------------------------------------------------
      - name: List deployed objects
        run: |
          snow sql -c telcostream --query "
            SELECT table_schema, table_name, table_type
            FROM TELCOSTREAM.INFORMATION_SCHEMA.TABLES
            WHERE table_schema IN ('BRONZE','SILVER','GOLD','CONTROL')
            ORDER BY table_schema, table_name;
          "